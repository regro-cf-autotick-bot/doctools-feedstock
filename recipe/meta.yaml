{% set name = "doctools" %}
{% set version = "0.2.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/doctools-{{ version }}.tar.gz
  sha256: 39b7ffcb13a8ac015cda877635fa3c3a188183a9d5bb9779ffc691212518b684

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - pytest
    - pytest-cov
    - python >={{ python_min }}

test:
  imports:
    - doctools
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/awagner83/doctools
  summary: docblock manipulation utilities
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ocefpaf
